<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SCAN, LEARN & ACT — امسح الرمز، تعلّم، وتصرّف</title>
<style>
:root{--bg:#fff;--card:#f4f5f8;--tx:#1b2f5b;--red:#9b1c24;--navy:#1b2f5b;--bd:#d9dce4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161f;--card:#1d2330;--tx:#eef0f5;--red:#ff8f96;--navy:#9db8ff;--bd:#343c4f}}
:root[data-theme=dark]{--bg:#12161f;--card:#1d2330;--tx:#eef0f5;--red:#ff8f96;--navy:#9db8ff;--bd:#343c4f}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.8 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left);overflow-x:hidden}
header{background:#1b2f5b;color:#fff;padding:12px 16px}header a{color:#fff}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}.logo{height:84px;display:flex;align-items:center}.logo img{height:100%;width:auto;display:block}
h1{font-size:1.2rem;margin:0}h1 small{display:block;font-weight:400;font-size:.85rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}nav a,button,.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--red);background:var(--bg);color:var(--red);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center}
nav a{border-color:#fff;background:transparent;color:#fff}.pri{background:var(--red);color:#fff}:root[data-theme=dark] .pri{color:#12161f}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
main{max-width:960px;margin:auto;padding:16px}section{margin:28px 0}h2{color:var(--navy);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{display:flex;flex-direction:column;gap:6px;padding:10px;overflow-wrap:anywhere}.grid .card h3{font-size:1rem;line-height:1.5}.grid .card small{display:block;font-weight:400}.grid .card .btn{margin-top:auto;width:100%;justify-content:center;text-align:center;padding:6px 8px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.card h3{margin:0}.card p{margin:6px 0}
input[type=search]{width:100%;min-height:48px;font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
ol.steps{padding:0;list-style:none;counter-reset:s}ol.steps li{counter-increment:s;background:var(--card);border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start;border:2px solid transparent}
ol.steps li::before{content:counter(s);background:var(--red);color:#fff;min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700}
ol.steps li.on{border-color:var(--red)}ol.steps label{flex:1;display:flex;gap:10px}ol.steps input{width:26px;height:26px;flex:none}ol.steps input:checked+span{text-decoration:line-through;opacity:.7}
.warn{border-inline-start:6px solid var(--red)}.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select{min-height:44px;font:inherit;background:var(--bg);color:var(--tx)}
#call{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;justify-content:center;font-size:1.1rem;min-height:52px;background:#1b7a3a;color:#fff;border-color:#1b7a3a;text-decoration:none;max-width:420px;margin-inline:auto;box-shadow:0 2px 10px #0006}
:root[data-theme=dark] #call{color:#fff}
.note{font-size:.9rem;opacity:.85}.crumb{font-size:.9rem}.crumb a{color:var(--navy)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
